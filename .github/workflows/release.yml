name: Release

# Run manually once changesets (.changeset/*.md) are merged to main.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install knope
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'knope'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download knope/v0.24.0 -R knope-dev/knope -p 'knope-x86_64-pc-windows-msvc.tgz' -D $dir
          tar -xzf (Join-Path $dir 'knope-x86_64-pc-windows-msvc.tgz') -C $dir
          $exe = Get-ChildItem $dir -Recurse -Filter knope.exe | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $exe.DirectoryName
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bumps Cargo.toml, updates CHANGELOG.md, commits and pushes.
      - name: Prepare release
        run: knope prepare-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: cargo build --release --locked

      - name: Package assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item target/release/sight.exe dist/sight.exe
          Copy-Item install.ps1 dist/install.ps1
          $hash = (Get-FileHash dist/sight.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  sight.exe" | Set-Content -Encoding ascii dist/sight.exe.sha256
          Copy-Item target/release/sight.exe, README.md, README.zh-CN.md, README.zh-TW.md, AGENTS.md, LICENSE, install.ps1 stage/
          Copy-Item docs stage/docs -Recurse
          Copy-Item skills stage/skills -Recurse
          Compress-Archive -Path stage/* -DestinationPath dist/sight-windows-x64.zip

      # Tags the release commit and creates the GitHub release with dist/* assets.
      - name: Publish GitHub release
        run: knope publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # knope titles the release "0.1.0 (date)". Retitle it "v0.1.0" and put the
      # install commands for exactly this version above the changelog.
      - name: Retitle release and add install notes
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          changes=$(gh release view "$tag" --json body -q .body)
          {
            echo '## Install'
            echo
            echo '```powershell'
            echo "& ([scriptblock]::Create((irm https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/install.ps1))) -Version $version"
            echo '```'
            echo
            echo 'Or download `sight.exe` below and put it on your `PATH`. Verify it with `sight.exe.sha256`.'
            echo
            echo "## What's changed"
            echo
            echo "$changes"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
