[package]
versioned_files = ["Cargo.toml"]
changelog = "CHANGELOG.md"

[[package.assets]]
path = "dist/sight.exe"

[[package.assets]]
path = "dist/sight.exe.sha256"

[[package.assets]]
path = "dist/sight-windows-x64.zip"

# Create a changeset in .changeset/ describing a user-facing change.
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

# Bump Cargo.toml, update CHANGELOG.md, commit, push, then tag and create the
# GitHub release (uploading the assets above, which CI builds beforehand).
[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "cargo update --workspace --offline"

[[workflows.steps]]
type = "Command"
command = "git add Cargo.toml Cargo.lock CHANGELOG.md"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: release $version\""
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Command"
command = "git push"

[[workflows.steps]]
type = "Release"

# CI step 1: bump version, update changelog, commit and push.
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "cargo update --workspace --offline"

[[workflows.steps]]
type = "Command"
command = "git add Cargo.toml Cargo.lock CHANGELOG.md"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: release $version\""
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Command"
command = "git push"

# CI step 2: tag and create the GitHub release with the built assets.
[[workflows]]
name = "publish"

[[workflows.steps]]
type = "Release"

[github]
owner = "sao-coding"
repo = "sightline"
