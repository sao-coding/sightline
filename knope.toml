# Version bump and changelog come from changesets in .changeset/ only; commit
# messages are never read. https://knope.tech/reference/config-file/changes/
[changes]
ignore_conventional_commits = true

[package]
versioned_files = ["Cargo.toml"]
changelog = "CHANGELOG.md"

[[package.assets]]
path = "dist/sight.exe"

[[package.assets]]
path = "dist/sight.exe.sha256"

[[package.assets]]
path = "dist/install.ps1"

[[package.assets]]
path = "dist/sight-windows-x64.zip"

# Create a changeset in .changeset/ describing a user-facing change.
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

# Step 1 (CI, prepare-release workflow): put the version bump and changelog on a
# `release` branch and open or update a PR to main. Never pushes to main.
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "cargo update --workspace"

[[workflows.steps]]
type = "Command"
command = "git add Cargo.toml Cargo.lock CHANGELOG.md .changeset"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: release v$version\""
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: release v$version"

[workflows.steps.body]
template = "Merging this PR publishes v$version.\n\n$changelog"

# Step 2 (CI, release workflow, after the release PR is merged): tag and create
# the GitHub release with the assets above, which CI builds beforehand.
[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "sao-coding"
repo = "sightline"
